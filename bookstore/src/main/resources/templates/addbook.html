<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Book</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
<div class="container mt-5">
    <h1 th:text="${book.id == null} ? 'Add Book' : 'Edit Book'"></h1>

    <form th:object="${book}" th:action="@{/saveBook}" method="post">

        <input type="hidden" th:field="*{id}">

        <!-- Title ja author pakolliset -->
        <label for="title" class="mt-3 mb-1">Title</label>
        <input type="text" id="title" th:field="*{title}" required>

        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" required>

        <label for="publicationYear">Publication year</label>
        <input type="number" id="publicationYear" th:field="*{publicationYear}">

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}">

        <label for="price">Price</label>
        <input type="number" id="price" step="0.01" th:field="*{price}">

        <input class="btn btn-primary mt-3" type="submit" th:value="${book.id == null} ? 'Add Book' : 'Save Changes'">

    </form>
</div>

</body>
</html>
