<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add/Edit Book</title>
    <meta charset="UTF-8">
</head>

<body>
    <h1>Add / Edit Book</h1>

    <form th:object="${book}" th:action="@{/saveBook}" method="post">

        <input type="hidden" th:field="*{id}">
        
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" required>

        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" required>

        <label for="publicationYear">Publication year</label>
        <input type="number" id="publicationYear" th:field="*{publicationYear}">

        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}">

        <label for="price">Price</label>
        <input type="number" id="price" step="0.01" th:field="*{price}">

        <input type="submit" value="Save Book">

    </form>

</body>
</html>
