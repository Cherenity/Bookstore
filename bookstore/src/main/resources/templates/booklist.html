<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <title>Book List</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>
  <table class="table table-striped">
    <tr>
      <th>Book ID</th>
      <th>Title</th>
      <th>Author</th>
      <th>Publication Year</th>
      <th>ISBN</th>
      <th>Price</th>
      <th>Category</th>
      <th></th>
      <th></th>
    </tr>

    <tr th:each="book : ${books}">
      <td th:text="${book.id}">Book ID</td>
      <td th:text="${book.title}">Title</td>
      <td th:text="${book.author}">Author</td>
      <td th:text="${book.publicationYear}">Publication Year</td>
      <td th:text="${book.isbn}">ISBN</td>
      <td th:text="${book.price}">Price</td>
      <!-- Display the category name if it exists, otherwise display "No Category" -->
      <td th:text="${book.category != null ? book.category.name : 'No Category'}">
        Category
      </td>

      <td>
        <a class="btn btn-danger" th:href="@{/deleteBook/{id}(id=${book.id})}">Delete</a>
      </td>

      <td>
        <a class="btn btn-warning" th:href="@{/editBook/{id}(id=${book.id})}">Edit</a>
      </td>

    </tr>
  </table>
  <a class="btn btn-primary" th:href="@{/addBook}">Add Book</a>

</html>
